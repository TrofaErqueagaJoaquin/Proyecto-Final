# Chequeo de 1 minuto (rediseño de 2026). Generado desde habitos-v1.yaml: mismas preguntas, opciones,
# puntaje y reglas de recomendación. NO es un instrumento validado: es una propuesta del proyecto.
# Una versión publicada no se edita: para cambiar algo, copiá el archivo y subí `version`.
slug: chequeo
title: Chequeo de 1 minuto
description: Seis preguntas cortas, una por tema, para saber por dónde empezar hoy. Es una
  orientación, no un diagnóstico.
version: 1
evidenceLabel: propuesta_proyecto
estimatedMinutes: 1
minAgeMonths: 0
maxAgeMonths: 215
sections:
  - code: sueno
    title: Sueño
    description: Cuánto duerme y qué pasa antes de dormir.
    questions:
      - code: screens_before_bed
        prompt: En la hora antes de dormir, ¿usa pantallas?
        type: single
        options:
          - code: never
            label: Casi nunca
            value: 100
          - code: sometimes
            label: Algunos días (1 a 3 por semana)
            value: 50
          - code: most_days
            label: La mayoría de los días
            value: 0
  - code: movimiento
    title: Movimiento
    description: Juego activo y tiempo quieto.
    questions:
      - code: floor_time
        prompt: Despierto, ¿cuánto tiempo pasa por día en el piso, boca abajo o moviéndose libremente?
        help: Sumá los ratos cortos de todo el día.
        type: single
        maxAgeMonths: 11
        options:
          - code: lt15
            label: Menos de 15 minutos
            value: 0
          - code: m15_30
            label: Entre 15 y 30 minutos
            value: 50
          - code: gt30
            label: Más de 30 minutos
            value: 100
      - code: active_play
        prompt:
          En un día habitual, ¿cuánto tiempo de juego activo tiene (correr, saltar, trepar, bailar,
          andar en bici)?
        type: single
        minAgeMonths: 12
        options:
          - code: lt30
            label: Menos de 30 minutos
            value: 0.25
          - code: m30_60
            label: Entre 30 minutos y 1 hora
            value: 0.75
          - code: h1_2
            label: Entre 1 y 2 horas
            value: 1.5
          - code: h2_3
            label: Entre 2 y 3 horas
            value: 2.5
          - code: gt3
            label: Más de 3 horas
            value: 3.5
  - code: pantalla_tiempo
    title: Tiempo de pantalla
    description: Pantallas para entretenerse, sin contar la escuela ni las videollamadas.
    questions:
      - code: screen_weekday
        prompt: En un día de semana, ¿cuánto tiempo usa pantallas para entretenerse (videos, juegos,
          series)?
        type: single
        options:
          - code: none
            label: Nada
            value: 0
          - code: lt30
            label: Menos de 30 minutos
            value: 0.25
          - code: m30_60
            label: Entre 30 minutos y 1 hora
            value: 0.75
          - code: h1_2
            label: Entre 1 y 2 horas
            value: 1.5
          - code: h2_3
            label: Entre 2 y 3 horas
            value: 2.5
          - code: gt3
            label: Más de 3 horas
            value: 3.5
  - code: pantalla_contexto
    title: Cómo se usan las pantallas
    description: Con quién, qué contenido y en qué momentos.
    questions:
      - code: background_tv
        prompt: ¿Queda la TV prendida de fondo aunque nadie la esté mirando?
        type: single
        options:
          - code: rarely
            label: Casi nunca
            value: 100
          - code: sometimes
            label: A veces
            value: 50
          - code: often
            label: Casi todos los días
            value: 0
  - code: calma
    title: Calma
    description: Qué lo ayuda cuando está muy enojado o angustiado.
    minAgeMonths: 12
    maxAgeMonths: 155
    questions:
      - code: device_to_calm
        prompt: Cuando está muy enojado o angustiado, ¿con qué frecuencia la pantalla es la forma de
          calmarlo?
        type: single
        options:
          - code: rarely
            label: Casi nunca
            value: 100
          - code: sometimes
            label: A veces
            value: 60
          - code: often
            label: Seguido
            value: 20
          - code: almost_always
            label: Casi siempre
            value: 0
  - code: acuerdos
    title: Acuerdos en casa
    description: Reglas sobre cuándo y dónde se usan las pantallas.
    minAgeMonths: 36
    questions:
      - code: clear_rules
        prompt: ¿Hay acuerdos claros sobre cuándo y dónde se usan las pantallas?
        type: single
        options:
          - code: yes
            label: Sí
            value: 100
          - code: partly
            label: Más o menos
            value: 50
          - code: no
            label: Todavía no
            value: 0
scoring:
  engineVersion: 1.0.0
  maxRecommendations: 3
  dimensions:
    - code: sueno
      bands: &a1
        - max: 39
          band: priority
        - max: 69
          band: watch
        - max: 100
          band: strength
      texts:
        strength: Las horas de sueño y lo que pasa antes de dormir acompañan bien. Vale la pena sostenerlo.
        watch:
          Hay algo del sueño para mirar, como las horas o las pantallas antes de dormir. Un cambio
          chico ayuda.
        priority:
          El sueño puede ser un buen lugar para empezar. Una rutina tranquila antes de dormir suele
          ayudar a toda la casa.
    - code: movimiento
      bands: *a1
      texts:
        strength: Tiene buenos momentos para moverse durante el día. Es una base para todo lo demás.
        watch: Podría sumar un poco más de movimiento o cortar los ratos largos quieto.
        priority: Moverse más puede ser un buen primer paso. Alcanza con juegos cortos en casa o en la plaza.
    - code: pantalla_tiempo
      bands: *a1
      texts:
        strength: El tiempo de pantalla está cerca de lo que sugieren las guías para su edad.
        watch: El tiempo de pantalla está un poco por encima de lo que sugieren las guías para su edad.
        priority:
          El tiempo de pantalla está bastante por encima de lo sugerido para su edad. Conviene
          bajarlo de a poco.
    - code: pantalla_contexto
      bands: *a1
      texts:
        strength: Cómo se usan las pantallas en casa ayuda mucho, con compañía y contenido elegido.
        watch: Hay detalles del uso para ajustar, como la TV de fondo o la reproducción automática.
        priority:
          Cambiar cómo se usan las pantallas puede ayudar más que contar minutos. Hay pasos simples
          para empezar.
    - code: calma
      bands: *a1
      texts:
        strength: Tiene varias formas de calmarse además de la pantalla.
        watch: La pantalla aparece seguido para calmarse. Sumar otras opciones de a poco ayuda.
        priority:
          Calmarse sin pantalla está costando. Es un buen momento para practicar otras formas, en
          momentos tranquilos.
    - code: acuerdos
      bands: *a1
      texts:
        strength: Los acuerdos en casa están claros y los adultos también los cumplen.
        watch: Hay acuerdos, pero se pueden ajustar o revisar juntos.
        priority: Armar acuerdos simples sobre cuándo y dónde usar pantallas puede bajar las discusiones.
