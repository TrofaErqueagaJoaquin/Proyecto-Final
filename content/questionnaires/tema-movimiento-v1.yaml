sections:
  - code: movimiento
    title: Movimiento
    description: Juego activo y tiempo quieto.
    questions:
      - code: floor_time
        prompt: Despierto, ¿cuánto tiempo pasa por día en el piso, boca abajo o moviéndose libremente?
        help: Sumá los ratos cortos de todo el día.
        type: single
        maxAgeMonths: 11
        options:
          - code: lt15
            label: Menos de 15 minutos
            value: 0
          - code: m15_30
            label: Entre 15 y 30 minutos
            value: 50
          - code: gt30
            label: Más de 30 minutos
            value: 100
      - code: active_play
        prompt:
          En un día habitual, ¿cuánto tiempo de juego activo tiene (correr, saltar, trepar, bailar,
          andar en bici)?
        type: single
        minAgeMonths: 12
        options:
          - code: lt30
            label: Menos de 30 minutos
            value: 0.25
          - code: m30_60
            label: Entre 30 minutos y 1 hora
            value: 0.75
          - code: h1_2
            label: Entre 1 y 2 horas
            value: 1.5
          - code: h2_3
            label: Entre 2 y 3 horas
            value: 2.5
          - code: gt3
            label: Más de 3 horas
            value: 3.5
      - code: sitting_stretch
        prompt: ¿Pasa más de una hora seguida sentado o sujeto (cochecito, silla, sillón) sin moverse?
        type: single
        options:
          - code: rarely
            label: Casi nunca
            value: 100
          - code: sometimes
            label: A veces
            value: 50
          - code: often
            label: Casi todos los días
            value: 0
