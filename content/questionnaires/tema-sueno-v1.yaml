      - code: sleep_hours
        prompt: En un día habitual, ¿cuántas horas duerme en total, contando las siestas?
        help: Un número aproximado alcanza. Por ejemplo, 10 u 11,5.
        type: number
        number:
          min: 0
          max: 24
          step: 0.5
          unit: horas
      - code: screens_before_bed
        prompt: En la hora antes de dormir, ¿usa pantallas?
