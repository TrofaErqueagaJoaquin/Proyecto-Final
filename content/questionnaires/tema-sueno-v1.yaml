            value: 50
          - code: most_days
            label: La mayoría de los días
            value: 0
      - code: device_in_bedroom
        prompt: ¿Duerme con algún dispositivo en el dormitorio (celular, tablet, TV)?
        type: single
        options:
          - code: no
            label: No
            value: 100
          - code: yes
            label: Sí
            value: 0
