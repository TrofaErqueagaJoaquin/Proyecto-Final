name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Formato, lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # usa la versión de "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: El contenido de content/ es válido
        run: pnpm content:check
      - run: pnpm turbo run lint typecheck test
      - run: pnpm test:scripts
      - run: pnpm turbo run build
        env:
          # Valores públicos ficticios: el export web los exige, pero CI no se conecta a nada.
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - name: El bundle web no contiene secretos del servidor
        run: |
          # Se buscan claves reales (prefijo + valor), no el prefijo solo: supabase-js incluye
          # "sb_secret_" en su propio chequeo de formato de claves.
          if grep -rIlE -e 'sb_secret_[A-Za-z0-9_-]{16,}' -e 'sk-ant-[A-Za-z0-9_-]{16,}' -e 'SUPABASE_SECRET_KEY' apps/app/dist; then
            echo "::error::Se encontró un posible secreto en el bundle web"; exit 1
          fi

  database:
    name: Base de datos (migraciones y pruebas pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aproximación rápida en PGlite
        run: pnpm db:test:local
      - name: Iniciar Supabase local (solo los servicios necesarios)
        run: pnpm exec supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,storage-api
      - name: Pruebas pgTAP contra Supabase real
        run: pnpm exec supabase test db
      # Se regeneran los tipos desde las migraciones y se vuelve a chequear todo el código contra
      # ellos: si una migración rompe el código, falla. (Comparar el texto contra el archivo
      # generado desde el proyecto remoto es frágil: los generadores difieren en formato.)
      - name: El código compila contra los tipos generados desde las migraciones
        run: |
          pnpm exec supabase gen types typescript --local --schema public > packages/shared/src/db.types.ts
          pnpm turbo run typecheck --force
      - name: Lint de funciones PL/pgSQL
        run: pnpm exec supabase db lint --level error --fail-on error

  secrets:
    name: Búsqueda de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
